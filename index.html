<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Cybersecurity Scenario Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A1222;--bg2:#0F1D36;--panel:#13223D;--panel2:#1A2D4E;--line:#2A4068;--text:#EEF3FB;--dim:#93A4C2;--red:#FF5A6A;--green:#2EE59D;--amber:#FFB547;--blue:#5AA9FF}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,var(--bg),var(--bg2));color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh;line-height:1.5}
body:before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(42,64,104,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(42,64,104,.18) 1px,transparent 1px);background-size:56px 56px;pointer-events:none;z-index:0}
a{color:inherit}
.wrap{position:relative;z-index:1;display:grid;grid-template-columns:280px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto;background:rgba(10,18,34,.8)}
.brand{font-weight:800;font-size:19px;margin:0 6px 2px;cursor:pointer}
.brand small{display:block;color:var(--dim);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.lang{display:flex;gap:6px;margin:12px 6px 0}.lang a{flex:1;text-align:center;text-decoration:none;font-size:13px;font-weight:700;padding:7px 8px;border:1px solid var(--line);border-radius:999px;color:var(--dim)}.lang a.on{background:var(--blue);border-color:var(--blue);color:#0A1222}
.who{margin:18px 6px 14px;display:grid;gap:8px}
.who input{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 11px;font:inherit;font-size:14px}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.navlabel{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--dim);margin:16px 8px 6px;text-transform:uppercase}
.seg{display:flex;gap:6px;margin:0 6px 4px}.seg button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--dim);font:inherit;font-weight:700;font-size:13px;cursor:pointer}.seg button.on{background:var(--blue);color:var(--bg);border-color:var(--blue)}
.prog{margin:6px 6px 0;height:10px;border-radius:99px;background:var(--panel);overflow:hidden}.prog i{display:block;height:100%;background:var(--green)}
.progt{margin:6px 6px;font-size:13px;color:var(--dim);font-weight:600}
nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:10px;text-decoration:none;font-size:13.5px;font-weight:600;border:1px solid transparent}
nav a:hover{background:var(--panel)} nav a.on{background:var(--panel2);border-color:var(--line)}
nav .num{flex:0 0 26px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--panel);border:1px solid var(--line);color:var(--dim)}
nav a.done .num{background:var(--green);color:var(--bg);border-color:var(--green)} nav a.part .num{border-color:var(--amber);color:var(--amber)}
main{padding:28px 40px 80px;max-width:1240px}
.unitchip{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.08em;padding:5px 12px;border-radius:999px;border:1.5px solid currentColor}
.u14{color:var(--red)} .u15{color:var(--green)} .unews{color:var(--amber)}
h1{font-size:38px;line-height:1.1;margin:12px 0 6px;letter-spacing:-.02em}
h2.sec{font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:30px 0 12px}
.lesson{color:var(--dim);font-weight:600;margin:0 0 18px}
.hero{display:flex;gap:24px;align-items:center;flex-wrap:wrap;background:rgba(19,34,61,.85);border:1px solid var(--line);border-radius:18px;padding:22px 24px}
.hero .steps{display:flex;gap:10px;flex-wrap:wrap}
.hero .st{background:var(--panel2);border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px}
.hero .st b{color:var(--amber)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.vcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
.vcard:hover{transform:translateY(-3px);border-color:var(--blue)}
.vcard .th{position:relative;aspect-ratio:16/9;background:#000 center/cover no-repeat}
.vcard .th .len{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.75);padding:2px 8px;border-radius:6px;font-size:12px;font-weight:700}
.vcard .th .play{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transition:.15s;background:rgba(0,0,0,.25)}
.vcard:hover .th .play{opacity:1}
.vcard .th .play span{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;color:#0A1222;font-size:22px}
.vcard .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.vcard .k{font-size:11px;font-weight:800;letter-spacing:.1em}
.vcard .t{font-weight:800;font-size:16px;line-height:1.25}
.vcard .ft{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--dim);font-weight:600}
.badge{padding:3px 9px;border-radius:99px;font-weight:800;font-size:12px;border:1px solid var(--line)}
.badge.done{background:rgba(46,229,157,.14);color:var(--green);border-color:var(--green)}
.badge.part{background:rgba(255,181,71,.12);color:var(--amber);border-color:var(--amber)}
.player{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:16/9}
.player video{width:100%;height:100%;display:block}
.player:fullscreen{border-radius:0}
.qcard{position:absolute;inset:0;background:rgba(5,10,20,.72);display:none;align-items:center;justify-content:center;padding:3%;z-index:3;backdrop-filter:blur(3px)}
.qcard.on{display:flex;animation:fadein .25s}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.qbox{background:var(--panel);border:2px solid var(--blue);border-radius:18px;padding:22px 24px;max-width:860px;width:100%;max-height:100%;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:up .3s}
@keyframes up{from{transform:translateY(24px)}to{transform:none}}
.qbox .tag{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--blue);margin-bottom:6px}
.qbox .qt{font-size:19px;font-weight:700;margin:0 0 12px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:11px 14px;border:1px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer;background:rgba(10,18,34,.5);color:var(--text);font:inherit;font-size:15.5px}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt .L{font-weight:800;color:var(--dim);min-width:18px}
.opt.sel{border-color:var(--blue);background:rgba(90,169,255,.12)}
.opt.right{border-color:var(--green);background:rgba(46,229,157,.12)}
.opt.wrong{border-color:var(--red);background:rgba(255,90,106,.12)}
.opt:disabled{cursor:default}
.fb{margin:10px 0 4px;padding:10px 14px;border-left:4px solid var(--green);background:var(--panel2);border-radius:0 10px 10px 0;font-size:14.5px}
.fb.bad{border-color:var(--red)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font:inherit;font-weight:800;font-size:15px;cursor:pointer;text-decoration:none}
.go{background:var(--green);color:var(--bg)} .blue{background:var(--blue);color:var(--bg)} .ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}
.under{display:flex;align-items:center;gap:14px;margin:10px 0 0;flex-wrap:wrap}
.track{flex:1;min-width:200px;height:8px;background:var(--panel);border-radius:99px;position:relative}
.track i{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--panel2);border:2px solid var(--blue)}
.track i.ok{background:var(--green);border-color:var(--green)} .track i.no{background:var(--red);border-color:var(--red)}
.track i.d{border-color:var(--amber);background:var(--amber);border-radius:4px}
.tip{font-size:13px;color:var(--dim)}
.step{background:rgba(19,34,61,.88);border:1px solid var(--line);border-radius:18px;padding:22px 24px;margin:20px 0 0}
.step h3{display:flex;align-items:center;gap:12px;font-size:20px;margin:0 0 14px}
.step h3 .bdg{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:800;color:var(--bg)}
.b2{background:var(--amber)}.b3{background:var(--green)}.b1{background:var(--blue)}
.locked{opacity:.45;pointer-events:none;filter:grayscale(.4)}
.lockmsg{font-size:14px;color:var(--amber);font-weight:700;margin:0 0 10px}
ol.prompts{margin:0;padding:0;list-style:none;counter-reset:p;display:grid;gap:10px}
ol.prompts li{counter-increment:p;background:var(--panel2);border-radius:12px;padding:12px 14px 12px 54px;position:relative;font-weight:600}
ol.prompts li:before{content:counter(p);position:absolute;left:14px;top:11px;width:28px;height:28px;border-radius:50%;background:var(--amber);color:var(--bg);display:grid;place-items:center;font-weight:800;font-size:14px}
textarea{width:100%;min-height:96px;background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;font:inherit;font-size:15px;resize:vertical}
label.small{display:block;font-size:13px;color:var(--dim);font-weight:600;margin:14px 0 6px}
.qt2{font-weight:700;margin:16px 0 10px}
.sortrow{display:grid;grid-template-columns:1fr 210px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px;font:inherit;font-size:14px}
.sortrow.right select{border-color:var(--green)} .sortrow.wrong select{border-color:var(--red)}
.msg{font-size:14px;font-weight:600}.msg.err{color:var(--red)}.msg.ok{color:var(--green)}
.scorebox{display:inline-block;font-weight:800;padding:6px 12px;border-radius:999px;background:rgba(46,229,157,.12);color:var(--green);border:1px solid var(--green)}
.review{display:grid;gap:10px}
.review .ri{background:var(--panel2);border-radius:12px;padding:12px 14px;font-size:14.5px}
.review .ri b{color:var(--green)} .review .ri.x b{color:var(--red)}
.case p{background:var(--panel2);border-radius:12px;padding:12px 16px;margin:8px 0}
.case p b{color:var(--amber)}
.opt2{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer;background:rgba(10,18,34,.35)}
.opt2 input{margin-top:4px}
.opt2.right{border-color:var(--green);background:rgba(46,229,157,.10)} .opt2.wrong{border-color:var(--red);background:rgba(255,90,106,.10)}
.why{display:none;margin:8px 0;padding:10px 14px;border-left:4px solid var(--green);background:var(--panel2);border-radius:0 10px 10px 0;font-size:14px}
.lockd .why{display:block}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:14px 0}
.card{background:var(--panel2);border-radius:14px;padding:16px}.card .k{font-size:28px;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12.5px;max-height:340px;overflow:auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;place-items:center;z-index:20}
.modal.on{display:grid}.modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px;max-width:440px}
@media (max-width:900px){.wrap{grid-template-columns:1fr}aside{position:relative;height:auto}main{padding:18px}.grid3{grid-template-columns:1fr}.sortrow{grid-template-columns:1fr}.qbox .qt{font-size:16px}.opt{font-size:14px;padding:8px 10px}}
</style>
</head>
<body>
<div class="wrap">
<aside>
  <div class="brand" onclick="location.hash='#home'">AI Cyber Scenario Lab<small>AP Cybersecurity · Units 1.4 + 1.5</small></div>

</div>

<script>
const VIDEOS = [{"id": "00", "title": "In the News: AI & Cyber Right Now", "unit": "UNITS 1.4 + 1.5 \u00b7 NEWS BRIEFING", "file": "AI_Cyber_00_in_the_news.mp4", "cfile": "AI_Cyber_00_in_the_news_cartoon.mp4", "prompts": ["Which of these stories worries you most? Why?", "The FAA outage turned out NOT to be an attack. In the first hour, how could defenders tell the difference?", "Has anyone you know received a scam call, text, or DM? What gave it away?"], "mins": "2:30", "cmins": "2:40"}, {"id": "01", "title": "Scenario 1: The 11:48 PM Call", "unit": "UNIT 1.4 \u00b7 AI AS THE WEAPON", "file": "AI_Cyber_01_the_1148_pm_call.mp4", "cfile": "AI_Cyber_01_the_1148_pm_call_cartoon.mp4", "prompts": ["Be honest: would you have sent the $300? What would have convinced you?", "Write two rules for a strong family code word. What should it NEVER be, and where should it NEVER appear?", "Where is YOUR voice online right now?"], "mins": "1:45", "cmins": "1:51"}, {"id": "02", "title": "Scenario 2: The FaceTime That Wasn't", "unit": "UNIT 1.4 \u00b7 AI AS THE WEAPON", "file": "AI_Cyber_02_the_facetime_that_wasnt.mp4", "cfile": "AI_Cyber_02_the_facetime_that_wasnt_cartoon.mp4", "prompts": ["List every \u201ctrust signal\u201d that made the FaceTime believable.", "Why is a password request a red flag even if it really IS your friend?", "A video of a celebrity giving away crypto goes viral. What two things should you check before believing it?"], "mins": "1:24", "cmins": "1:26"}, {"id": "03", "title": "Scenario 3: The Perfect Email", "unit": "UNIT 1.4 \u00b7 AI AS THE WEAPON", "file": "AI_Cyber_03_the_perfect_email.mp4", "cfile": "AI_Cyber_03_the_perfect_email_cartoon.mp4", "prompts": ["Which red flags from Unit 1.1 still work when a message is written perfectly? Build a class list.", "Why does \u201cwrites fluently in any language\u201d make phishing more dangerous?", "Who in your family would be most likely to fall for an AI-written message? Why?"], "mins": "1:33", "cmins": "1:37"}, {"id": "04", "title": "Scenario 4: Talking the Chatbot Into It", "unit": "UNIT 1.4 \u00b7 AI AS THE WEAPON", "file": "AI_Cyber_04_talking_the_chatbot_into_it.mp4", "cfile": "AI_Cyber_04_talking_the_chatbot_into_it_cartoon.mp4", "prompts": ["Why does \u201cmy teacher told me to\u201d work on a chatbot? Which social engineering trick does it copy?", "If you built StudyBuddy, what information would you make sure it could never reach?", "What should the student have removed before pasting the project?"], "mins": "1:29", "cmins": "1:38"}, {"id": "05", "title": "Scenario 5: Poisoning the Well", "unit": "UNIT 1.4 \u00b7 AI AS THE WEAPON", "file": "AI_Cyber_05_poisoning_the_well.mp4", "cfile": "AI_Cyber_05_poisoning_the_well_cartoon.mp4", "prompts": ["A student asks the school chatbot for the Wi-Fi password \u201cbecause the principal said it's fine.\u201d Injection or poisoning?", "A fake wiki claims the school app spies on students. Months later, an AI repeats it. Injection or poisoning?", "Explain the difference between the two in ONE sentence."], "mins": "1:31", "cmins": "1:37"}, {"id": "06", "title": "Scenario 6: A Few Hours of Recon", "unit": "UNIT 1.4 \u00b7 AI AS THE WEAPON", "file": "AI_Cyber_06_a_few_hours_of_recon.mp4", "cfile": "AI_Cyber_06_a_few_hours_of_recon_cartoon.mp4", "prompts": ["What could an AI learn about YOUR school from public posts? (Patterns only, no names.)", "Pick one target. What should that person do differently? What should the school do?", "AI makes recon cheap and fast. Who benefits most: big hacking groups, or beginners? Why?"], "mins": "1:34", "cmins": "1:41"}, {"id": "07", "title": "Scenario 7: The Overnight Auditor", "unit": "UNIT 1.5 \u00b7 AI AS THE SHIELD", "file": "AI_Cyber_07_the_overnight_auditor.mp4", "cfile": "AI_Cyber_07_the_overnight_auditor_cartoon.mp4", "prompts": ["Run the audit on yourself: what would an AI flag on YOUR accounts tonight? (Patterns, no confessions.)", "The AI says close port 22, but the IT team uses it for nightly maintenance. What should happen next?", "Why not let the AI push its code fix straight to the live grade portal?"], "mins": "2:00", "cmins": "2:05"}, {"id": "08", "title": "Scenario 8: Five Million Events", "unit": "UNIT 1.5 \u00b7 AI AS THE SHIELD", "file": "AI_Cyber_08_five_million_events.mp4", "cfile": "AI_Cyber_08_five_million_events_cartoon.mp4", "prompts": ["If you're the attacker, what does the 5 million / 1% math tell you? If you're the defender, what do you need?", "Your bank flags a 4 AM login from a new country on a new device. Why is the COMBINATION the clue?", "Which automated responses should happen instantly, and which should wait for a person?"], "mins": "2:07", "cmins": "2:13"}, {"id": "09", "title": "Scenario 9: False Alarm or Real Attack?", "unit": "UNIT 1.5 \u00b7 AI AS THE SHIELD", "file": "AI_Cyber_09_false_alarm_or_real_attack.mp4", "cfile": "AI_Cyber_09_false_alarm_or_real_attack_cartoon.mp4", "prompts": ["Which error is more dangerous: a false positive or a false negative? Defend your answer.", "What context did the analyst use that the AI didn't have?", "If an AI cries wolf 50 times a day, what happens to the people reading the alerts?"], "mins": "1:46", "cmins": "1:45"}, {"id": "10", "title": "Scenario 10: The Kill Switch", "unit": "UNIT 1.5 \u00b7 AI AS THE SHIELD", "file": "AI_Cyber_10_the_kill_switch.mp4", "cfile": "AI_Cyber_10_the_kill_switch_cartoon.mp4", "prompts": ["Sort the five actions: autopilot or ask a human first? Justify each one.", "You're the analyst at 10:14 AM. What do you do, and what do you tell the principal?", "Connect to the news: the FAA stopped every flight as a precaution. Was that a good human judgment call? Why?"], "mins": "1:24", "cmins": "1:28"}];
const Q = {"00": {"lesson": "News briefing (1.4 + 1.5)", "mcq": [{"q": "In the first hours of the November 13 FAA outage, officials would not rule out a cyberattack. Days later, the FAA traced it to old telecom equipment flooded with connection attempts during a router installation. What does this show about defenders' work?", "o": ["Defenders must investigate whether unusual activity is an attack or a failure before drawing conclusions", "Every outage should be treated as an attack and everything shut down", "Outages only matter if a hacker claims responsibility", "News reports are the best way to identify the cause of an outage"], "a": 0, "why": "Floods of strange activity can come from attacks OR failures. Detection tools surface the anomaly; human investigation and judgment decide what it actually is."}, {"q": "Prosecutors say a group used AI-cloned voices and images of company executives to convince employees to send money. Which Unit 1.4 attack does this most closely match?", "o": ["Data poisoning", "Prompt injection", "Deepfake impersonation (voice spoofing)", "Buffer overflow"], "a": 2, "why": "Using AI to fake a real person's voice or image so others trust the request is a deepfake / voice-spoofing attack."}], "sr": "Pick ONE news story from the video. Which defense from Unit 1.4 or 1.5 could have reduced the damage, and how?"}, "01": {"lesson": "1.4.1 + 1.4.4: Voice cloning, vishing, shared secrets", "mcq": [{"q": "Jordan's phone showed \u201cMaya\u201d and the voice sounded exactly like her. Why do those two things NOT prove the call is real?", "o": ["Caller ID never works on late-night calls", "AI can clone a voice from a few seconds of public audio, so a familiar voice is no longer proof of identity", "Maya's voice sounded robotic if you listened closely", "Siblings can't call each other on Venmo"], "a": 1, "why": "AI studies pitch, tone, speech patterns, and accent from short clips (TikToks, Discord, voice messages). A familiar voice is no longer proof se is SQL injection."}, {"q": "An AI scanner flags the SQL injection and recommends a fix. What's the appropriate next step?", "o": ["Push the fix to the live portal immediately", "Ignore it; developers know their own code", "Report the developer to management", "Have a knowledgeable programmer review the vulnerability AND the fix before deciding"], "a": 3, "why": "A fix can break other features (like \u201cforgot my password\u201d). AI supports human decisions; it doesn't replace them."}], "sr": "Run the audit on yourself: name TWO settings an AI auditor would likely flag on a typical student's accounts, and the fix for each."}, "08": {"lesson": "1.5.2: Detect, filter, respond", "mcq": [{"q": "Why can't human analysts manually review all digital events on a network?", "o": ["Humans aren't smart enough to understand network events", "The volume of millions of events exceeds human capacity, and humans need rest while adversaries work around the clock", "Network events are written in a secret language", "Analysts aren't allowed to access servers"], "a": 1, "why": "10 analysts can review about 1% of 5 million events. The rest would never be looked at."}, {"q": "Your bank flags a login at 4 AM, from a country you've never visited, on a device it's never seen. Why does the AI flag it?", "o": ["No single detail proves anything, but the COMBINATION matches the fingerprint of malicious activity", "Any login at 4 AM is always an attack", "The bank blocks all foreign countries", "The AI was told your password"], "a": 0, "why": "Detection tools learn patterns from historical attack data; unusual combinations stand out."}, {"q": "Why is the speed of threat detection and response critical?", "o": ["Companies can brag about fast response times", "Speed doesn't matter as long as threats are eventually found", "Faster detection and response shrink the window attackers have to cause damage", "It removes the need for human security professionals"], "a": 2, "why": "Months \u2192 minut   const item = (id, n, label) => { const s = status(id); const sc = scoreOf(id);
    return `<a href="#m-${id}" class="${cur==="m-"+id?"on":""} ${s}"><span class="num">${s==="done"?"✓":n}</span><span>${esc(label)}</span></a>`; };
  let h = `<div class="navlabel">Missions</div><a href="#home" class="${cur==="home"?"on":""}"><span class="num">⌂</span><span>All mission cards</span></a>`;
  h += item("00","N","In the News");
  h += `<div class="navlabel">Unit 1.4 · weapon</div>` + VIDEOS.filter(v=>+v.id>=1&&+v.id<=6).map(v=>item(v.id, +v.id, short(v))).join("");
  h += `<div class="navlabel">Unit 1.5 · shield</div>` + VIDEOS.filter(v=>+v.id>=7).map(v=>item(v.id, +v.id, short(v))).join("");
  h += `<div class="navlabel">Wrap-up</div>` + item("cap","★","Capstone case") + `<a href="#m-results" class="${cur==="m-results"?"on":""}"><span class="num">≡</span><span>My results</span></a>`;
  $("#nav").innerHTML = h;
  document.querySelectorAll("#style button").forEach(b=>b.classList.toggle("on", b.dataset.v===(S.style||"cartoon")));
}

function cardHTML(v){
  const s = status(v.id), sc = scoreOf(v.id), n = CPS[v.id].cps.length;
  const badge = s==="done" ? `<span class="badge done">✓ ${sc[0]}/${sc[1]}</span>` : s==="part" ? `<span class="badge part">${answered(v.id)}/${n} checkpoints</span>` : `<span class="badge">Not started</span>`;
  const kicker = v.id==="00" ? ["unews","NEWS BRIEFING"] : +v.id<=6 ? ["u14","SCENARIO "+(+v.id)+" · UNIT 1.4"] : ["u15","SCENARIO "+(+v.id)+" · UNIT 1.5"];
  return `<a class="vcard" href="#m-${v.id}"><div class="th" style="background-image:url('${THUMB_BASE}${v.id}.jpg')"><span class="len">${S.style==="classic"?v.mins:v.cmins}</span><div class="play"><span>▶</span></div></div>
    <div class="bd"><div class="k ${kicker[0]}">${kicker[1]}</div><div class="t">${esc(short(v))}</div><div class="ft"><span>${n} checkpoint questions</span>${badge}</div></div></a>`;
}
function renderHome(){
  const capS = status("cap"), capSc = scoreOf("cap");
  $("#main").innerHTML = `<span class="unitchip unews">AP CYBERSECURITY · JUICEMIND 1.4 + 1.5</span>
  <h1>AI Cybersecurity Scenario Lab</h1><p class="lesson">Pick a mission card. The video stops at each checkpoint so you can answer before it moves on.</p>
  <div class="hero"><div class="steps"><div class="st"><b>1</b> Watch the scenario</div><div class="st"><b>2</b> Answer checkpoints as the video pauses</div><div class="st"><b>3</b> Discuss with your partner</div><div class="st"><b>4</b> Make your call &amp; submit</div></div>
  <div class="tip">${S.name?`Signed in as <b>${esc(S.name)}</b>, period ${esc(S.period||"?")}.`:`Type your name and period in the sidebar first.`} Your answers are saved in this browser only.</div></div>
  <h2 class="sec">Start here</h2><div class="grid">${cardHTML(VIDEOS[0])}</div>
  <h2 class="sec">Unit 1.4 · AI as the weapon</h2><div class="grid">${VIDEOS.slice(1,7).map(cardHTML).join("")}</div>
  <h2 class="sec">Unit 1.5 · AI as the shield</h2><div class="grid">${VIDEOS.slice(7).map(cardHTML).join("")}</div>
  <h2 class="sec">Wrap-up</h2><div class="grid">
   <a class="vcard" href="#m-cap"><div class="th" style="background:linear-gradient(135deg,#2a1f45,#0f1d36)"><div class="play" style="opacity:1;background:none"><span style="background:var(--amber)">★</span></div></div><div class="bd"><div class="k unews">CAPSTONE CASE</div><div class="t">${esc(CAP.title)}</div><div class="ft"><span>No video · uses everything</span>${capS==="done"?`<span class="badge done">✓ ${capSc[0]}/${capSc[1]}</span>`:`<span class="badge">Not started</span>`}</div></div></a>
   <a class="vcard" href="#m-results"><div class="th" style="background:linear-gradient(135deg,#123d33,#0f1d36)"><div class="play" style="opacity:1;background:none"><span style="background:var(--green)">≡</span></div></div><div class="bd"><div class="k u15">TURN IT IN</div><div class="t">My results</div><div class="ft"><span>Copy and submit</span></div></div></a></div>`;
}

// ---------------------------------------------------------------- mission player
let rafId = null;
function renderMission(id){
  const v = VIDEOS.find(x=>x.id===id), qq = Q[id], st = stOf(id), cp = CPS[id], style = S.style==="classic"?"classic":"cartoon";
  const T = c => c[style]; const discT = cp["disc_"+style];
  st.started = true; save();
  const nCP = cp.cps.length;
  let h = `<span class="unitchip ${unitClass(v.unit)}">${esc(v.unit)}</span><h1>${esc(v.title)}</h1><p class="lesson">${esc(qq.lesson)}</p>
  <div class="player" id="player"><video id="vid" playsinline preload="metadata" controls controlslist="nofullscreen nodownload" disablepictureinpicture src="${VIDEO_BASE}${esc(style==="classic"?v.file:v.cfile)}"></video><div class="qcard" id="qcard"></div></div>
  <div class="under"><button class="btn ghost" id="fs" title="Full screen">⛶ Full screen</button><div class="track" id="track"></div><span class="tip" id="cpinfo"></span></div>`;
  h += `<div class="step" id="disc"><h3><span class="bdg b2">❚❚</span>Discuss with your partner</h3><p class="lockmsg" id="dlock">Unlocks when the video reaches its Pause &amp; Discuss screen.</p>
    <ol class="prompts">${v.prompts.map(p=>`<li>${esc(p)}</li>`).join("")}</ol>
    <label class="small" for="notes">Discussion notes (optional, not graded)</label><textarea id="notes" placeholder="What did your partner say?">${esc(st.notes||"")}</textarea></div>`;
  h += `<div class="step" id="final"><h3><span class="bdg b3">✔</span>Your call ${st.done?`<span class="scorebox" style="margin-left:auto">${scoreOf(id)[0]} / ${scoreOf(id)[1]} correct</span>`:""}</h3><div id="finalBody"></div></div>`;
  $("#main").innerHTML = h;
  const vid = $("#vid"), qc = $("#qcard");
  const pending = () => cp.cps.find(c => st.mcq[c.q]===undefined || st.mcq[c.q]===null);
  function drawTrack(){
    const d = vid.duration || 1;
    $("#track").innerHTML = cp.cps.map(c=>{ const a = st.mcq[c.q]; const cls = a===undefined||a===null ? "" : (a===qq.mcq[c.q].a?"ok":"no"); return `<i class="${cls}" style="left:${100*T(c)/d}%" title="Checkpoint"></i>`; }).join("") + `<i class="d" style="left:${100*discT/d}%" title="Discuss"></i>`;
    $("#cpinfo").textContent = `${cp.cps.filter(c=>st.mcq[c.q]!==undefined&&st.mcq[c.q]!==null).length}/${nCP} checkpoints answered`;
  }
  vid.addEventListener("loadedmetadata", drawTrack);
  vid.addEventListener("error", ()=>{
    const url = new URL(vid.getAttribute("src"), location.href).href;
    qc.innerHTML = `<div class="qbox" style="border-color:var(--red)"><div class="tag" style="color:var(--red)">VIDEO DIDN'T LOAD</div><p class="qt">This video couldn't be loaded from:</p><p style="word-break:break-all;font-family:'JetBrains Mono',monospace;font-size:13px">${esc(url)}</p><p class="tip">Teacher: check that this file exists at that address. If your host can't serve video files, set VIDEO_BASE at the top of the page's script to a host that can.</p><div class="row"><button class="btn ghost" id="trycl">Try the ${S.style==="classic"?"cartoon":"classic"} version</button></div></div>`;
    qc.classList.add("on");
    $("#trycl").addEventListener("click", ()=>{ S.style = S.style==="classic"?"cartoon":"classic"; save(); route(); });
  });
  function reachedDisc(){ return st.reached || (vid.currentTime >= discT - .3) || vid.ended; }
  function updateLocks(){
    const allCP = !pending();
    if (reachedDisc() && allCP) { st.reached = true; save(); }
    const open = st.reached || st.done;
    $("#disc").classList.toggle("locked", !open); $("#dlock").style.display = open ? "none" : "block";
    $("#final").classList.toggle("locked", !open && !st.done);
    renderFinal(id, open);
  }
  function showQ(c){
    vid.pause(); if (Math.abs(vid.currentTime - T(c)) > .4) vid.currentTime = T(c);
    const q = qq.mcq[c.q], idx = cp.cps.indexOf(c) + 1; let sel = null;
    qc.innerHTML = `<div class="qbox"><div class="tag">CHECKPOINT ${idx} OF ${nCP}</div><p class="qt">${esc(q.q)}</p>
      ${q.o.map((o,j)=>`<button class="opt" data-j="${j}"><span class="L">${L[j]}</span><span>${esc(o)}</span></button>`).join("")}
      <div id="fbx"></div><div class="row"><button class="btn blue" id="chk" disabled>Check answer</button></div></div>`;
    qc.classList.add("on");
    qc.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{ sel=+b.dataset.j; qc.querySelectorAll(".opt").forEach(x=>x.classList.toggle("sel", x===b)); $("#chk").disabled=false; }));
    $("#chk").addEventListener("click",()=>{
      st.mcq[c.q] = sel; save();
      qc.querySelectorAll(".opt").forEach(x=>{ const j=+x.dataset.j; x.disabled=true; x.classList.remove("sel"); if(j===q.a) x.classList.add("right"); else if(j===sel) x.classList.add("wrong"); });
      const ok = sel===q.a;
      $("#fbx").innerHTML = `<div class="fb ${ok?"":"bad"}"><b>${ok?"✔ Correct.":"✘ Not quite. The answer is "+L[q.a]+"."}</b> ${esc(q.why)}</div>`;
      $("#chk").outerHTML = `<button class="btn go" id="cont">Continue video ▶</button>`;
      $("#cont").addEventListener("click",()=>{ qc.classList.remove("on"); qc.innerHTML=""; drawTrack(); renderSide(); updateLocks(); vid.play().catch(()=>{}); });
      $("#cont").focus();
    });
  }
  function tick(){
    if (!document.body.contains(vid)) return;
    const p = pending();
    if (p && !st.done && !vid.paused && vid.currentTime >= T(p) - .06) showQ(p);
    if (!st.reached) updateLocks();
    rafId = requestAnimationFrame(tick);
  }
  vid.addEventListener("seeking", ()=>{ const p = pending(); if (p && !st.done && vid.currentTime > T(p) + .1) { vid.currentTime = T(p) - .05; } });
  vid.addEventListener("play", ()=>{ if (qc.classList.contains("on")) vid.pause(); });
  vid.addEventListener("ended", updateLocks);
  $("#fs").addEventListener("click", ()=>{ const p=$("#player"); try{ (document.fullscreenElement? document.exitFullscreen() : p.requestFullscreen()).catch(()=>{}); }catch(e){} });
  $("#notes").addEventListener("input", e=>{ st.notes=e.target.value; save(); });
  cancelAnimationFrame(rafId); rafId = requestAnimationFrame(tick);
  updateLocks();
}

function renderFinal(id, open){
  const qq = Q[id], st = stOf(id), cp = CPS[id], box = $("#finalBody"); if(!box) return;
  if (box.dataset.state === (st.done?"done":open?"open":"closed")) return;
  box.dataset.state = st.done?"done":open?"open":"closed";
  let h = "";
  if (!open && !st.done) h += `<p class="lockmsg">Answer every checkpoint and reach the end of the video to unlock this.</p>`;
  if (st.done) {
    h += `<div class="review">` + cp.cps.map((c,i)=>{ const q=qq.mcq[c.q]; const ok = st.mcq[c.q]===q.a; return `<div class="ri ${ok?"":"x"}"><b>${ok?"✔":"✘"} Checkpoint ${i+1}:</b> ${esc(q.q)}<br><span class="tip">Your answer: ${L[st.mcq[c.q]]} · Correct: ${L[q.a]}. ${esc(q.why)}</span></div>`; }).join("") + `</div>`;
  }
  if (qq.sort) {
    h += `<p class="qt2">${esc(qq.sort.prompt)}</p>` + qq.sort.items.map((it,i)=>{ const cls = st.done ? (it[1].includes(st.sort[i])?"right":"wrong") : "";
      return `<div class="sortrow ${cls}"><span>${esc(it[0])}</span><select data-s="${i}" ${st.done?"disabled":""}><option value="">Choose…</option><option value="auto" ${st.sort[i]==="auto"?"selected":""}>AI on autopilot</option><option value="human" ${st.sort[i]==="human"?"selected":""}>Human decides first</option></select></div>`; }).join("");
    if (st.done) h += `<p class="tip">Rule of thumb: clear threat + small, easy-to-undo response → autopilot. Big, disruptive, or hard-to-undo → a human decides first. (Locking the account can go either way.)</p>`;
  }
  h += `<p class="qt2">Short response: ${esc(qq.sr)}</p><textarea id="sr" ${st.done?"disabled":""} placeholder="Write 2–5 complete sentences.">${esc(st.sr||"")}</textarea>`;
  if (!st.done) h += `<div class="row"><button class="btn go" id="submit">Submit mission</button><span class="msg" id="msg"></span></div>`;
  else { const i = ALL.indexOf(id); const nx = ALL[i+1]; h += `<p class="tip">Your teacher will score the short response.</p><div class="row">${nx?`<a class="btn go" href="#m-${nx}">Next mission →</a>`:""}<a class="btn ghost" href="#home">All mission cards</a></div>`; }
  box.innerHTML = h;
  box.querySelectorAll("select").forEach(s=>s.addEventListener("change", e=>{ st.sort[+e.target.dataset.s]=e.target.value; save(); }));
  const sr = $("#sr"); if (sr) sr.addEventListener("input", e=>{ st.sr=e.target.value; save(); });
  const b = $("#submit"); if (b) b.addEventListener("click", ()=>{
    if (cp.cps.some(c=>st.mcq[c.q]===undefined||st.mcq[c.q]===null)) return err("Answer every checkpoint in the video first.");
    if (qq.sort && qq.sort.items.some((it,i)=>!st.sort[i])) return err("Sort all five actions first.");
    if ((st.sr||"").trim().split(/\s+/).filter(Boolean).length < 12) return err("Your short response needs at least a couple of complete sentences.");
    ask("Submit this mission? You can't change your answers after this.", ()=>{ st.done=true; st.when=new Date().toLocaleString(); save(); route(); });
  });
  function err(m){ $("#msg").className="msg err"; $("#msg").textContent=m; }
}

// ---------------------------------------------------------------- capstone (reading case, no video)
function renderCap(){
  const st = stOf("cap"), locked = st.done;
  let h = `<span class="unitchip unews">CAPSTONE · UNITS 1.4 + 1.5</span><h1>${esc(CAP.title)}</h1><p class="lesson">No video this time. Read the case file and use everything from the missions.</p>
  <div class="step case"><h3><span class="bdg b2">★</span>Case file</h3>${CAP.setup.map(s=>{const m=s.match(/^(\d+:\d+ PM):(.*)$/); return `<p>${m?`<b>${m[1]}</b>${esc(m[2])}`:esc(s)}</p>`;}).join("")}</div>
  <div class="step ${locked?"lockd":""}" id="assess"><h3><span class="bdg b3">?</span>Your decisions ${locked?`<span class="scorebox" style="margin-left:auto">${scoreOf("cap")[0]} / ${scoreOf("cap")[1]} correct</span>`:""}</h3>`;
  CAP.mcq.forEach((q,i)=>{
    h += `<p class="qt2">${i+1}. ${esc(q.q)}</p>` + q.o.map((o,j)=>{ let cls=""; if(locked){ if(j===q.a) cls="right"; else if(st.mcq[i]===j) cls="wrong"; }
      return `<label class="opt2 ${cls}"><input type="radio" name="q${i}" value="${j}" ${st.mcq[i]===j?"checked":""} ${locked?"disabled":""}><b>${L[j]}</b><span>${esc(o)}</span></label>`; }).join("") + `<div class="why">${esc(q.why)}</div>`;
  });
  h += `<p class="qt2">${CAP.mcq.length+1}. ${esc(CAP.sr)}</p><textarea id="sr" ${locked?"disabled":""}>${esc(st.sr||"")}</textarea>`;
  h += locked ? `<div class="row"><a class="btn go" href="#m-results">My results →</a></div>` : `<div class="row"><button class="btn go" id="submit">Submit capstone</button><span class="msg" id="msg"></span></div>`;
  $("#main").innerHTML = h + `</div>`;
  document.querySelectorAll('#assess input[type=radio]').forEach(r=>r.addEventListener("change", e=>{ st.mcq[+e.target.name.slice(1)] = +e.target.value; save(); }));
  const sr=$("#sr"); if(sr) sr.addEventListener("input", e=>{ st.sr=e.target.value; save(); });
  const b=$("#submit"); if(b) b.addEventListener("click", ()=>{
    if (CAP.mcq.some((q,i)=>st.mcq[i]===undefined)) { $("#msg").className="msg err"; $("#msg").textContent="Answer every question first."; return; }
    if ((st.sr||"").trim().split(/\s+/).filter(Boolean).length < 12) { $("#msg").className="msg err"; $("#msg").textContent="Write a few complete sentences for the incident summary."; return; }
    ask("Submit the capstone?", ()=>{ st.done=true; save(); route(); });
  });
}

// ---------------------------------------------------------------- results
function resultsText(){
  let c=0,t=0, lines=["AI CYBER SCENARIO LAB — RESULTS", "Name: "+(S.name||"(no name)")+"   Period: "+(S.period||"?"), ""];
  ALL.forEach(id=>{ const st=S.m[id], sc=scoreOf(id), qq = id==="cap"?CAP:Q[id];
    const title = id==="cap" ? "CAPSTONE: "+CAP.title : VIDEOS.find(v=>v.id===id).title;
    if(sc){c+=sc[0]; t+=sc[1];}
    lines.push(title+": "+(sc?`${sc[0]}/${sc[1]} multiple choice`:"NOT SUBMITTED"));
    if(st&&st.done){ lines.push("  Answers: "+qq.mcq.map((q,i)=>`Q${i+1}${L[st.mcq[i]]}`).join(" ")+(qq.sort?"  Sort: "+st.sort.map(x=>x==="auto"?"A":"H").join(""):"")); lines.push("  Short response: "+(st.sr||"").trim().replace(/\s+/g," ")); }
    lines.push("");
  });
  lines.splice(2,0,`TOTAL MULTIPLE CHOICE: ${c}/${t}`+(t?` (${Math.round(100*c/t)}%)`:""), `Video style used: ${S.style||"cartoon"}`, "");
  return lines.join("\n");
}
function renderResults(){
  let c=0,t=0,doneN=0;
  const rows = ALL.map(id=>{ const sc=scoreOf(id); if(sc){c+=sc[0];t+=sc[1];doneN++;} const title = id==="cap"?"Capstone: "+CAP.title:VIDEOS.find(v=>v.id===id).title;
    return `<tr><td>${esc(title)}</td><td>${sc?`<b style="color:var(--green)">${sc[0]}/${sc[1]}</b>`:`<a href="#m-${id}" style="color:var(--amber)">Not submitted</a>`}</td><td>${sc&&S.m[id].sr?"✔":"—"}</td></tr>`; }).join("");
  $("#main").innerHTML = `<span class="unitchip unews">RESULTS</span><h1>My Results</h1><p class="lesson">${esc(S.name||"Add your name in the sidebar")} · Period ${esc(S.period||"?")}</p>
  <div class="grid3"><div class="card"><div class="k" style="color:var(--green)">${t?Math.round(100*c/t):0}%</div>multiple choice (${c}/${t})</div><div class="card"><div class="k" style="color:var(--blue)">${doneN}/${ALL.length}</div>missions submitted</div><div class="card"><div class="k" style="color:var(--amber)">${ALL.filter(id=>S.m[id]&&S.m[id].done&&S.m[id].sr).length}</div>short responses for your teacher</div></div>
  <div class="step"><table><tr><th>Mission</th><th>Multiple choice</th><th>Short response</th></tr>${rows}</table></div>
  <div class="step"><h3>Turn it in</h3><p style="margin-top:0">Copy your results, then paste them where your teacher tells you (Google Classroom or JuiceMind).</p>
  <div class="row" style="margin-top:0"><button class="btn go" id="copy">Copy my results</button><span class="msg" id="cmsg"></span></div>
  <label class="small">Your results</label><pre id="rt">${esc(resultsText())}</pre>
  <div class="row"><button class="btn ghost" id="reset">Start over (clears everything)</button></div></div>`;
  $("#copy").addEventListener("click", async ()=>{ try{ await navigator.clipboard.writeText(resultsText()); $("#cmsg").className="msg ok"; $("#cmsg").textContent="Copied. Now paste it into your assignment."; }catch(e){ $("#cmsg").className="msg err"; $("#cmsg").textContent="Copy was blocked. Select the text below and copy it."; const r=document.createRange(); r.selectNodeContents($("#rt")); const s=getSelection(); s.removeAllRanges(); s.addRange(r);} });
  $("#reset").addEventListener("click", ()=>ask("Erase all your answers in this browser?", ()=>{ S={name:"",period:"",m:{},style:S.style||"cartoon"}; save(); $("#sname").value=""; $("#speriod").value=""; route(); }));
}
function ask(text, yes){ $("#modalText").textContent=text; $("#modal").classList.add("on"); $("#mYes").onclick=()=>{$("#modal").classList.remove("on"); yes();}; $("#mNo").onclick=()=>$("#modal").classList.remove("on"); }
function route(){
  cancelAnimationFrame(rafId);
  const h = location.hash.replace("#","");
  const id = h.startsWith("m-") ? h.slice(2) : "home";
  if(id==="results") renderResults(); else if(id==="cap") renderCap(); else if(Q[id]) renderMission(id); else renderHome();
  renderSide(); window.scrollTo(0,0);
}
document.querySelectorAll("#style button").forEach(b=>b.addEventListener("click",()=>{ S.style=b.dataset.v; save(); route(); }));
$("#sname").value=S.name||""; $("#speriod").value=S.period||"";
$("#sname").addEventListener("input",e=>{S.name=e.target.value; save();}); $("#speriod").addEventListener("input",e=>{S.period=e.target.value; save();});
window.addEventListener("hashchange", route); route();
</script>
